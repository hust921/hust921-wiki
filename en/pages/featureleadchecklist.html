<html>
<head>
<meta content="text/html;charset=utf-8" http-equiv="Content-Type">

<style>
*{	margin:0;	padding:0; }

body{
    margin-top: 10px;
    background:#b8581f;
    color:#fff;
    font-family: 'Kalam';
    font-size:26;
}

/*HEADER*/
h1{text-align:center;}
hr{margin-left:10px;margin-right:10px;}


/*WRAPPER*/
#wrapper{ text-align:center; margin: 40px auto 0; }
#wrapper > div{ margin-bottom:10px; }
.textwrapper{ text-align:left; display:inline-block; overflow:visible;}

/*CHECKBOX*/
input{ display:none; }

label div{
    width:23px;
    height:23px;
    display:inline-block;
    border:2px solid #fff;
    text-align:center;
    line-height:20px;
    margin-right:6px;
    border-radius:3px;
    cursor:pointer;
}

h1{text-align:center;}
.back-btn-wrap{
    float:left;
    display:inline-block;
    padding-left: 10px;
}
.back-btn-wrap a{
    text-decoration: none;
    font-size: 50px;
    padding: 10px 50px;
    color:#fff;
}
.back-btn-wrap a:hover{
    color:#000;
}

label i{ font-size:20px; opacity:0; }
input:checked+label i{ text-align: center; opacity:1; color:#eee;}
input:hover+label i{ opacity:1; color:#000;}
input:checked+label i{ color:#eee;}
.checkdev:hover{color:#000;}
</style>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<link href="https://netdna.bootstrapcdn.com/font-awesome/4.1.0/css/font-awesome.min.css" rel="stylesheet">

  <div class="back-btn-wrap">
      <a class="back-btn" href="javascript:history.back()"><i class="fa fa-arrow-circle-left"></i></a>
  </div>

  <h1>FL Checklist <i class="fa fa-check"></i> </h1>
  <hr style="color:#fff">
    
  <div id="wrapper">
  <div class="textwrapper">

  <h1>Before Epic <i class="fa fa-check"></i> </h1>

  	<div class="checkdev">
        <input type="checkbox" id="check1"/>
        <label for="check1">
          <div><i class="fa fa-check"></i></div> Are tasks refined?
        </label>
    </div>
    <div class="checkdev">
        <input type="checkbox" id="check2"/>
        <label for="check2">
          <div><i class="fa fa-check"></i></div> Is the branching strategy updated in the epic and repository?
        </label>
    </div>
    <div class="checkdev">
        <input type="checkbox" id="check3"/>
        <label for="check3">
          <div><i class="fa fa-check"></i></div> Should a Product Owner be appointed?
        </label>
    </div>
    <div class="checkdev">
        <input type="checkbox" id="check4"/>
        <label for="check4">
          <div><i class="fa fa-check"></i></div> For TS issues: Are you assigned, and is Jira aligned?
        </label>
    </div>

  <br />
  <hr style="color:#fff">
  <br />
  <h1>During Epic <i class="fa fa-check"></i> </h1>
    
  	<div class="checkdev">
        <input type="checkbox" id="check5"/>
        <label for="check5">
          <div><i class="fa fa-check"></i></div> Are there any tasks stuck? Take action.
        </label>
    </div>
    <div class="checkdev">
        <input type="checkbox" id="check6"/>
        <label for="check6">
          <div><i class="fa fa-check"></i></div> Have you planned discussions for new problems?
        </label>
    </div>

  <br />
  <hr style="color:#fff">
  <br />
  <h1>Before Epic Release <i class="fa fa-check"></i> </h1>
    
  	<div class="checkdev">
        <input type="checkbox" id="check7"/>
        <label for="check7">
          <div><i class="fa fa-check"></i></div> Does the release need coordination with a third party?
        </label>
    </div>
    <div class="checkdev">
        <input type="checkbox" id="check8"/>
        <label for="check8">
          <div><i class="fa fa-check"></i></div> Are there vulnerabilities in Azure? Take action if any.
        </label>
    </div>
    <div class="checkdev">
        <input type="checkbox" id="check9"/>
        <label for="check9">
          <div><i class="fa fa-check"></i></div> Is the documentation sufficient?
        </label>
    </div>
    <div class="checkdev">
        <input type="checkbox" id="check10"/>
        <label for="check10">
          <div><i class="fa fa-check"></i></div> Should a production release be monitored?
        </label>
    </div>

  <br />
  <hr style="color:#fff">
  <br />
  <h1>After Epic <i class="fa fa-check"></i> </h1>
    
  	<div class="checkdev">
        <input type="checkbox" id="check11"/>
        <label for="check11">
          <div><i class="fa fa-check"></i></div> Is the epic marked as Done in Jira?
        </label>
    </div>
    <div class="checkdev">
        <input type="checkbox" id="check12"/>
        <label for="check12">
          <div><i class="fa fa-check"></i></div> Does a related epic need refinement?
        </label>
    </div>
    <div class="checkdev">
        <input type="checkbox" id="check13"/>
        <label for="check13">
          <div><i class="fa fa-check"></i></div> Are there any loose ends to tie up?
        </label>
    </div>

  </div>
  </div>
</body>
</html>
